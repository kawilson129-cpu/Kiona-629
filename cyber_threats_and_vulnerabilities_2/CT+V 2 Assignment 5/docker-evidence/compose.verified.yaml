services:
  pulse-lab:
    build:
      context: ..
      dockerfile: cyber_threats_vulnerabilities_2_final/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status == 200"]
      interval: 30s
      timeout: 5s
      retries: 3
