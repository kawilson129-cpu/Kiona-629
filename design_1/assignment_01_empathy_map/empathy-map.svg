<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1020" viewBox="0 0 1360 1020" role="img" aria-labelledby="title description">
<title id="title">Casey at checkout — a Stay Data Stay empathy map</title>
<desc id="description">New assumption-labelled synthesis with Says, Thinks, Does, Feels, pains and gains. All persona statements are hypotheses; no interview was conducted.</desc>
<rect width="1360" height="1020" fill="#F7F4EC"/>
<text x="64" y="73" font-family="Georgia,serif" font-size="44" fill="#10291F">Casey at checkout</text>
<text x="64" y="112" font-family="Arial,sans-serif" font-size="20" fill="#4D6446">Stay Data Stay · hypothetical traveler · two-night hotel stay</text>
<text x="64" y="146" font-family="Arial,sans-serif" font-size="17" fill="#17251C">[A] All statements below are assumptions to validate, not interview quotations or observed behavior.</text>
<g id="says">
<rect x="64" y="184" width="584" height="228" rx="12" fill="#FFFFFF" stroke="#D8DFD2"/>
<text x="88" y="230" font-family="Georgia,serif" font-size="29" fill="#10291F">Says [A]</text>
<text x="88" y="278" font-family="Arial,sans-serif" font-size="19" fill="#17251C">“Which accounts did I use on this TV?”</text>
<text x="88" y="312" font-family="Arial,sans-serif" font-size="19" fill="#17251C">“Help me remember before I leave.”</text>
<text x="88" y="346" font-family="Arial,sans-serif" font-size="19" fill="#17251C">Illustrative self-talk, not user quotations.</text>
</g>
<g id="thinks">
<rect x="712" y="184" width="584" height="228" rx="12" fill="#FFFFFF" stroke="#D8DFD2"/>
<text x="736" y="230" font-family="Georgia,serif" font-size="29" fill="#10291F">Thinks [A]</text>
<text x="736" y="278" font-family="Arial,sans-serif" font-size="19" fill="#17251C">Unsure whether this hotel clears every login.</text>
<text x="736" y="312" font-family="Arial,sans-serif" font-size="19" fill="#17251C">Wants a shortlist, not another account setup.</text>
<text x="736" y="346" font-family="Arial,sans-serif" font-size="19" fill="#17251C">Wants to know the next action, not just a warning.</text>
</g>
<g id="does">
<rect x="64" y="436" width="584" height="228" rx="12" fill="#FFFFFF" stroke="#D8DFD2"/>
<text x="88" y="482" font-family="Georgia,serif" font-size="29" fill="#10291F">Does [A]</text>
<text x="88" y="530" font-family="Arial,sans-serif" font-size="19" fill="#17251C">Reviews recorded Netflix / YouTube selections.</text>
<text x="88" y="564" font-family="Arial,sans-serif" font-size="19" fill="#17251C">Checks the TV before packing the remote.</text>
<text x="88" y="598" font-family="Arial,sans-serif" font-size="19" fill="#17251C">Uses official help if the device is out of reach.</text>
</g>
<g id="feels">
<rect x="712" y="436" width="584" height="228" rx="12" fill="#FFFFFF" stroke="#D8DFD2"/>
<text x="736" y="482" font-family="Georgia,serif" font-size="29" fill="#10291F">Feels [A]</text>
<text x="736" y="530" font-family="Arial,sans-serif" font-size="19" fill="#17251C">Rushed by departure tasks.</text>
<text x="736" y="564" font-family="Arial,sans-serif" font-size="19" fill="#17251C">Uncertain about a leftover account session.</text>
<text x="736" y="598" font-family="Arial,sans-serif" font-size="19" fill="#17251C">Reassured by a clear next action.</text>
</g>
<g id="pains">
<rect x="64" y="688" width="584" height="228" rx="12" fill="#FFFFFF" stroke="#D8DFD2"/>
<text x="88" y="734" font-family="Georgia,serif" font-size="29" fill="#10291F">Pains [A]</text>
<text x="88" y="782" font-family="Arial,sans-serif" font-size="19" fill="#17251C">Packing and travel compete for attention.</text>
<text x="88" y="816" font-family="Arial,sans-serif" font-size="19" fill="#17251C">“Recorded” can be mistaken for “signed out”.</text>
<text x="88" y="850" font-family="Arial,sans-serif" font-size="19" fill="#17251C">Provider and hotel behaviors differ.</text>
</g>
<g id="gains">
<rect x="712" y="688" width="584" height="228" rx="12" fill="#FFFFFF" stroke="#D8DFD2"/>
<text x="736" y="734" font-family="Georgia,serif" font-size="29" fill="#10291F">Gains [A]</text>
<text x="736" y="782" font-family="Arial,sans-serif" font-size="19" fill="#17251C">One shortlist of services used.</text>
<text x="736" y="816" font-family="Arial,sans-serif" font-size="19" fill="#17251C">Honest wording about unverified sign-out.</text>
<text x="736" y="850" font-family="Arial,sans-serif" font-size="19" fill="#17251C">A route to the appropriate official guidance.</text>
</g>
<text x="64" y="962" font-family="Arial,sans-serif" font-size="16" fill="#4D6446">Basis: existing account-summary flow + authentic FigJam ideation + A2 secondary research.</text>
<text x="64" y="990" font-family="Arial,sans-serif" font-size="16" fill="#4D6446">New coursework synthesis · no participant session · not a Figma export · no live account state</text>
</svg>
